<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMMS Web Portal</title>
    <!-- Tailwind CSS (via CDN para prototipação) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 text-white flex flex-col">
        <div class="flex items-center justify-center h-16 bg-gray-800 font-bold text-xl">
            <i class="fas fa-cogs mr-2"></i> CMMS Portal
        </div>
        <nav class="flex-1 px-4 py-4 space-y-2">
            <a href="{% url 'home' %}" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md">
                <i class="fas fa-home mr-3"></i> Dashboard
            </a>
            <a href="{% url 'nova_solicitacao' %}" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md">
                <i class="fas fa-plus-circle mr-3"></i> Nova Solicitação
            </a>
            <hr class="border-gray-700 my-4">
            <a href="/admin" class="flex items-center px-4 py-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded-md">
                <i class="fas fa-lock mr-3"></i> Acesso Administrativo
            </a>
        </nav>
    </div>

    <!-- Conteúdo Principal -->
    <div class="flex-1 flex flex-col overflow-y-auto">
        <!-- Header -->
        <header class="h-16 bg-white shadow flex items-center px-6 justify-between">
            <h1 class="text-2xl font-semibold text-gray-800">
                {% block header_title %}Bem-vindo{% endblock %}
            </h1>
            <div class="flex items-center">
                {% if user.is_authenticated %}
                    <span class="text-gray-600 mr-4">Olá, {{ user.username }}</span>
                {% else %}
                    <span class="text-gray-600 mr-4">Não logado</span>
                {% endif %}
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            {% block content %}
            {% endblock %}
        </main>
    </div>

</body>
</html>
